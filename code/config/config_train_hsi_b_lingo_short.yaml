# Model B short-budget LINGO-only diffusion training config
defaults:
  - dataset: lingo_v3_train
  - guidance:
      - pelvis
  - model:
      - infbagel_mix
  - sampler:
      - pelvis_mix
  - _self_

exp_name: hsi_b_lingo_short
seed: 42
random_seed: 42
sample_type: diffusion
lingo_scene_num: 45
lingo_data_ratio: 0.5
empty_omomo_scene: false
epochs: 1
ckpt_interval: 1
lingo_only: true

train: true
load_state_dict: false
batch_size: 256
effective_batch_size: 2048
gradient_accumulation_steps: 1
# Fallback: batch_size 128 x 8 GPUs, gradient_accumulation_steps 2 (55% memory, +5.9 h).
lr: 0.0002
warmup_updates: 2000
device: cuda:0
use_tensorboard: true
save_checkpoints: true
max_optimizer_updates: 300
benchmark_metrics_path: null
exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}

w: 0

num_gpus: 8
num_workers: 2
scene_type: occ_temp
max_window_size: 16
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: true
load_scene_goal: true
load_pelvis_goal: true
load_object_goal: true

human_only_ratio: 0.4

temp_voxel_num: 3

use_random_frame_bps: true
use_object_keypoints: true
add_object_voxel: true

loss_w_obj_pts: 50
loss_w_fk: 50
auto_regre_num: 2

start_epoch: 0
ckpt_path: ""

hydra:
  run:
    dir: ${exp_dir}
