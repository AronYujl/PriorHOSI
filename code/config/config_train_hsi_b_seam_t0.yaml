# B-match Stage 1, arm T0 -- the BUDGET CONTROL.
#
# 20 more epochs from hsi_b_lingo_full_v2 epoch222 with the objective UNCHANGED.
# Necessary: without it the seam weight's effect is confounded with the 20 extra
# epochs.
#
# WHY THIS IS A WEIGHTS-ONLY CONTINUATION AND NOT A `resume_from`.
# The 2026-08-25 functional smoke tried resume_from on the origin's rolling
# _resume.pth and was refused by design:
#     "resume state was written after epoch 222 stopped mid-epoch at the
#      optimizer-update budget; the run is finished and there is nothing to resume"
# That guard (train_infbagel.py:282) is correct and was NOT touched: the origin run
# ended by reaching its own preregistered max_optimizer_updates, so continuing it
# would silently exceed that schedule.  This pilot is a separately preregistered
# budget, which the guard cannot know.  So the arms start from epoch222's WEIGHTS
# with a fresh optimizer, which costs the Adam moments and gains nothing false.
#
# The pairing survives without the restored RNG: train_ddp seeds
# random/numpy/torch/cuda at `seed + rank` (train_infbagel.py:374-377) and the data
# order is DistributedSampler(seed=42).set_epoch(epoch), so both arms see
# bitwise-identical batches and timesteps from identical fresh Adam state.  The
# ~1/(1-beta2) ~ 1000-update Adam transient is therefore present in BOTH arms and
# cancels in the paired T1-minus-T0 contrast.  Consequence: T0 is the ONLY valid
# baseline for T1; the sealed epoch222 cell is not.
#
# Everything scientific is INHERITED from config_train_hsi_b_lingo_full: seed 42,
# 4 x 512 x accum 1 (effective 2048), bf16_tf32, lr 2e-4, warmup 2000,
# loss_w_fk 3, auto_regre_num 2, no gradient clipping.  Restating any of them here
# would let the two arms drift apart silently.
#
# Frozen spec: .claude/scratch/bmatch_20260825/FROZEN_PILOT_SPEC.md
# Preregistration: docs/plan/PHASE_1C_HSI.md, 2026-08-25 (third section), commit 519caba.
defaults:
  - config_train_hsi_b_lingo_full
  - _self_

exp_name: hsi_b_seam_t0

# T0 continued pre-E1 B-v2 weights and was trained at the pre-589ac7f
# Stage-1 commit, so its checkpoint requires the legacy layout.
occ_permute_fix: false

# 223..242 inclusive.  start_epoch=223 sets micro_steps = optimizer_updates =
# 223 * 656 = 146,288, which puts the lr schedule past its 2000-update warmup, so
# the lr is a flat 2e-4 for the whole pilot.  20 * 656 = 13,120 more updates lands
# on 159,408, so the epoch bound and the update bound coincide and neither
# truncates the other.
start_epoch: 223
epochs: 243
max_optimizer_updates: 159408

# The frozen common start: epoch222 weights, sha256 5daaf813ca82...
# Verified on CPU before any GPU work -- 218/218 tensors, 0 missing, 0 unexpected,
# every tensor bit-equal after load.  `strict=False` in utils.init_model is a silent
# partial-load path, so that check is a precondition, not a courtesy.
load_state_dict: true
model:
  infbagel:
    ckpt: /data/yujinlun/InfBaGel-hsi/results/hsi_b_lingo_full_v2/checkpoints/hsi_b_lingo_full_v2_epoch222.pth

# The launcher overrides resume_from to the ARM'S OWN rolling state (with
# start_epoch=0) when one exists, so an infrastructure restart continues instead of
# redoing the 20 epochs.  5 rather than the inherited 20 so that a restart loses at
# most ~0.47 h instead of ~1.8 h: the save block sits between epochs, consumes no
# RNG and touches no optimizer state, so the cadence is trajectory-neutral, and it
# is identical in both arms.
resume_from: ""
ckpt_interval: 5

# seam_loss_weight is deliberately ABSENT.  sampler/pelvis.yaml resolves it to 0.0
# through oc.select, p_losses takes the released branch, and the assembled loss is
# the identical five-term expression.
