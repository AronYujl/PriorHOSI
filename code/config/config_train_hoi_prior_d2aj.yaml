defaults:
  - config_train_hoi_prior
  - _self_

# D2-AJ: split the single fused goal/progress conditioning token into separate
# pelvis (xz), object and progress tokens (+525,312 params, 4 -> 6 condition
# tokens, self.position 20 -> 22).  Identical to D2-AI in every other respect,
# including the budget, so the two arms differ only in the goal pathway.
#
# As in D2-AI, d2x_fk_foot_temporal_routing stays FALSE (mode identity) while
# fk_foot_temporal_routing stays TRUE (the inherited behaviour).
mode: d2aj-split-goal-tokens
subphase: 1B-D2-AJ0
run_id: p1-hoi-d2aj-split-goal-tokens-s42-20260803
seed: 42

d2t_author_update_rule: false
d2u_balanced_author_update: false
d2v_balanced_long_budget: false
d2x_fk_foot_temporal_routing: false
d2ai_full_budget: false
d2aj_split_goal_tokens: true
fk_foot_temporal_routing: true
hoi_architecture_variant: d2aj_split_goal_tokens
optimizer_name: Adam
scheduler_name: none
gradient_clipping: false
primary_weight_variant: online

num_gpus: 4
batch_size: 512
effective_batch_size: 2048
gradient_accumulation_steps: 1
num_workers: 4
dataset_limit: 0

# The 61,440,000 cadence checkpoint (#20) is the preregistered go/no-go point:
# continue to the full budget only if at least one of contact_f1 /
# end_obj_trans_err / xy_points_err beats sealed D2-X at the same budget with a
# paired bootstrap CI excluding zero.
max_processed_windows: 299520000
validation_windows: 32768
validation_batch_size: 512
validation_interval_windows: 3072000
checkpoint_interval_windows: 3072000
pause_after_windows: null

learning_rate: 0.0001
warmup_windows: 0
minimum_lr_ratio: 1.0
weight_decay: 0.0
beta1: 0.9
beta2: 0.999
gradient_clip_norm: null
ema_decays: []
amp: false
max_consecutive_amp_overflows: 0

fk_weight: 0.3569973401779424
object_surface_weight: 0.4772322188400037
velocity_weight: 0.1
goal_weight: 1.0

init_checkpoint: null
resume_checkpoint: null
weight_init_checkpoint: null
weight_init_sha256: null
weight_init_variant: null
d2m_candidate: null
d2m_rng_audit: false
profile_every_update: true
