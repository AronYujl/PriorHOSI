defaults: [config_sample_hosi_source_eligibility_grasped, _self_]

exp_name: p5-benchmark-dataset-sources-r1-s42-20260911
run_id: ${exp_name}
device: cuda:4
inbetween:
  kimodo_device: cuda:5
multitask:
  subphase: 5.6.1
  stage: dataset_sources
  output_dir: ${oc.env:ROOT_DIR}/results/experiments/${exp_name}/benchmark
  source_eligibility:
    scene_mean_penetration_m: 0.001
    scene_max_penetration_m: 0.01
  dataset:
    source_manifest: ${oc.env:ROOT_DIR}/results/experiments/p5-benchmark-dataset-sources-r1-s42-20260911/benchmark/candidates.json
    output_dir: ${oc.env:ROOT_DIR}/results/experiments/${exp_name}/benchmark
    target_episodes: 128
    candidate_limit: 256
    candidates_per_task_direction: 8
    pair_attempt_limit: 96
    cut_options_per_source: 8
    minimum_frames: 49
    maximum_frames: 600
    minimum_walk_distance_m: 0.5
    standing_context_frames: 10
    standing_tilt_deg: 25.0
    standing_pelvis_height_m: 0.7
    standing_knee_flexion_deg: 45.0
    standing_speed_m_s: 0.5
    foot_support_m: 0.08
    yaw_offsets_deg: [0, -90, 90, 180]
    root_offsets_m: [[0, 0], [0.4, 0], [-0.4, 0], [0, 0.4], [0, -0.4]]
    omomo_anchor_offsets_m: [[0, 0], [0.5, 0], [-0.5, 0], [0, 0.5], [0, -0.5]]
    bridge_batch_size: 8
    lane_count: 1
    lane_index: 0
    render_limit: 16
    bridge_roots: []
    reuse_bridge_roots: []
    rotation_step_max_deg: 15.0
