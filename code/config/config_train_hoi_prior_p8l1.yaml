defaults:
  - config_train_hoi_prior
  - _self_

# Preregistered P8-L1: D2-AI mode at D2-X budget + hand-object geometry term.
# Uses d2ai_full_budget: true to pass the trainer's mode gate and get scaled
# geometry weights (0.357/0.477), ensuring fk_foot_temporal_routing and loss
# weights match the baseline recipe. The ONLY manipulated factors are budget
# (61.44M vs D2-AI's 299.52M) and hand_object_contact_weight (50.0 vs 0.0).
exp_name: p1-hoi-p8-hand-object-geom-l1-s42-20260805
seed: 42
mode: d2ai-full-budget
subphase: 1B-P8-L1
run_id: p1-hoi-p8-hand-object-geom-l1-s42-20260805

# D2-AI mode flags (identical to D2-AI: d2ai triggers LongBudget pathway)
d2t_author_update_rule: false
d2u_balanced_author_update: false
d2v_balanced_long_budget: false
d2x_fk_foot_temporal_routing: false
d2ai_full_budget: true
d2aj_split_goal_tokens: false
fk_foot_temporal_routing: true
hoi_architecture_variant: base

optimizer_name: Adam
scheduler_name: none
gradient_clipping: false
primary_weight_variant: online

num_gpus: 4
batch_size: 512
effective_batch_size: 2048
gradient_accumulation_steps: 1
num_workers: 4
dataset_limit: 0

# L1 budget: 61.44M (D2-X level), not D2-AI's 299.52M
max_processed_windows: 61440000
validation_windows: 32768
validation_batch_size: 512
validation_interval_windows: 3072000
checkpoint_interval_windows: 3072000
pause_after_windows: null

learning_rate: 0.0001
warmup_windows: 0
minimum_lr_ratio: 1.0
weight_decay: 0.0
beta1: 0.9
beta2: 0.999
gradient_clip_norm: null
ema_decays: []
amp: false
max_consecutive_amp_overflows: 0

# D2-AI sealed weights (must match _locked_loss_weights for LongBudget)
fk_weight: 0.3569973401779424
object_surface_weight: 0.4772322188400037

# P8 manipulated factor
hand_object_contact_weight: 50.0

velocity_weight: 0.1
goal_weight: 1.0

init_checkpoint: null
resume_checkpoint: null
weight_init_checkpoint: null
weight_init_sha256: null
weight_init_variant: null
d2m_candidate: null
d2m_rng_audit: false
profile_every_update: true
