# @package _global_
#
# The sealed D2-AI formal training recipe.
#
# Every full-budget HOIPrior arm from D2-AI onward is "this recipe, with one
# manipulated factor". Before 2026-08-11 each arm restated the recipe inline:
# measured across p9w3, p9w5, p10_hinge and d2ai, each arm file carried ~52
# keys of which 22 were byte-identical restatements of the base config and 23
# were this recipe. The manipulated factor was one or two keys.
#
# Copying 50 lines per arm is not merely verbose, it is a comparability hazard:
# "same recipe as the sealed baseline" was guaranteed by hand, and a single
# missed line silently produces an uncontrolled comparison. Composing the
# recipe makes that guarantee mechanical.
#
# THIS FILE IS FROZEN. It is the operational definition of the D2-AI baseline
# that P8/P9/P10 were measured against. Changing a value here retroactively
# changes what every future arm is compared to, so a change requires a dated
# plan amendment and a new recipe file rather than an edit in place.
#
# Provenance: extracted verbatim from the resolved configs of the eleven sealed
# D2-AI-lineage arms, which agree on all 25 keys below.

mode: d2ai-full-budget
d2ai_full_budget: true

# Budget: 299,520,000 / 2,048 = 146,250 optimizer updates exactly.
max_processed_windows: 299520000

# Resources: 4x RTX 3090 on the HOI worker, effective batch tier 2048.
num_gpus: 4
batch_size: 512
effective_batch_size: 2048
num_workers: 4
dataset_limit: 0

# Optimization: the author's rule, no schedule, no clipping, no AMP.
optimizer_name: Adam
scheduler_name: none
gradient_clipping: false
gradient_clip_norm: null
minimum_lr_ratio: 1.0
weight_decay: 0.0
amp: false
max_consecutive_amp_overflows: 0

# Checkpoint selection: the fixed final online weights, no EMA variants.
primary_weight_variant: online
ema_decays: []

# Validation and checkpoint cadence.
validation_windows: 32768
validation_batch_size: 512
validation_interval_windows: 3072000
checkpoint_interval_windows: 3072000

# Sealed objective weights and the inherited FK/foot temporal routing.
fk_foot_temporal_routing: true
fk_weight: 0.3569973401779424
object_surface_weight: 0.4772322188400037
