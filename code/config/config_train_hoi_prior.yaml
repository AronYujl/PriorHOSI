defaults:
  - dataset: hoi_prior
  - model:
      - hoi_prior
  - sampler:
      - hoi_prior
  - _self_

prior_type: hoi
experiment_name: hoi_prior
output_dir: ${oc.env:ROOT_DIR}/results/priors/${experiment_name}
device: cuda:0
seed: 2027
deterministic: false
num_gpus: 4
# 4 x RTX 3090 benchmark: global batch 2048, with convergence margin over bs=1024.
per_device_batch_size: 512
num_workers: 2
epochs: 501
auto_regre_num: 2
gradient_accumulation_steps: 1
amp: true
tensorboard: true
log_every_steps: 20
max_steps_per_epoch: 0
checkpoint_every_epochs: 20
resume_from: null

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0

loss_weights:
  object_points: 50.0
  forward_kinematics: 50.0

validation:
  split_unit: sequence
  fraction: 0.1
  split_seed: 2027
  noise_seed: 3407
  every_epochs: 5
  max_batches: 32

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
