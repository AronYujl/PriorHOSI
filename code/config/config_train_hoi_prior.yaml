phase: p1
subphase: 1B
expert: hoi
mode: smoke
run_id: null
seed: 42
repo_root: ${oc.env:ROOT_DIR}

# Run-start provenance gate.
#   require_clean_worktree: null  -> enforced exactly when run_id is set, i.e.
#                                    for every reportable run; explicit
#                                    true/false overrides that decision.
#   run_start_git_commit:   null  -> written by the trainer's preflight at run
#   worktree_preflight:     null     start. Never set either by hand; a value
#                                    supplied in a config is overwritten.
require_clean_worktree: null
run_start_git_commit: null
worktree_preflight: null

num_gpus: 1
batch_size: 2
effective_batch_size: 2
gradient_accumulation_steps: 1
num_workers: 0
dataset_limit: 64
split_manifest: ${repo_root}/experiments/splits/omomo_hoi_train_validation_seed42.json
data_contract_sha256: a908994bef58a21798af605f01df25582743e1066dd7d0211315c3f0c88951cf

max_processed_windows: 4
validation_windows: 0
validation_batch_size: ${batch_size}
validation_interval_windows: 0
checkpoint_interval_windows: 0
pause_after_windows: null

learning_rate: 0.0001
warmup_windows: 0
minimum_lr_ratio: 0.1
weight_decay: 0.01
beta1: 0.9
beta2: 0.999
gradient_clip_norm: 1.0
ema_decays: [0.999, 0.9999]
amp: true
max_consecutive_amp_overflows: 16

fk_weight: 50.0
object_surface_weight: 50.0
velocity_weight: 0.1
goal_weight: 1.0
# Preregistered P8 hand-object relative geometry term and its P10 repair flags.
# ``hand_object_contact_weight`` is deliberately not declared here: it stays 0.0
# for every configuration sealed before P8 and the trainer reads it with a 0.0
# default, so only the arm configs that use the term set it.  The P10/P11 flags
# and mask mode are declared so a resolved job config states the objective shape.
# hinge is in metres; 0.0 keeps the literal sealed squared-distance expression.
hand_object_contact_hinge: 0.0
# ``sealed`` preserves the reducer used by every existing geometry arm.
hand_object_contact_mask_mode: sealed
hand_object_contact_detach_object: false
# P11 removes only the contact-geometry gradient through root translation.
hand_object_contact_detach_root: false

window_frames: 16
history_frames: 2
diffusion_steps: 500
dim_model: 512
num_heads: 16
num_layers: 8
init_checkpoint: null
resume_checkpoint: null
resume_commit_transition_authorized: false
resume_source_commit: null
resume_target_commit: null
resume_transition_diff_sha256: null
weight_init_checkpoint: null
weight_init_sha256: null
weight_init_variant: null
d2m_candidate: null
d2m_rng_audit: false
d2t_author_update_rule: false
d2u_balanced_author_update: false
d2v_balanced_long_budget: false
d2x_fk_foot_temporal_routing: false
d2y_routed_foot_amplification: false
d2z_immutable_gt_near_ground_gating: false
d2ab_predicted_support_no_slip: false
d2ac_interaction_adapter: false
d2ad_local_frame_interaction_adapter: false
d2ae_sparse_relation_field: false
d2af_sqrt_alpha_bar_reliability: false
d2ag_selfcond_relation_source: false
d2ai_full_budget: false
d2aj_split_goal_tokens: false
hoi_architecture_variant: base
local_bps_query_workers: null
fk_foot_temporal_routing: false
routed_foot_residual_multiplier: 1.0
immutable_gt_near_ground_gating: false
d2z_gate_audit_path: null
d2z_gate_audit_sha256: null
d2ab_support_metadata_path: null
d2ab_support_metadata_sha256: null
d2af_clean_signal_eligibility_path: null
d2af_clean_signal_eligibility_sha256: null
d2af_performance_benchmark_path: null
