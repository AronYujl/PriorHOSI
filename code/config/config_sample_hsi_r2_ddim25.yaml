# CM1.3: fixed R2 weights, the 25-grid deterministic teacher solver used by CM1.
defaults: [config_sample_hsi_table3, _self_]

lingo_hsi_mode: sample
sample_type: ddim
ckpt_path: /data/yujinlun/InfBaGel-hsi-r2/results/hsi_b_r2_fullbody_seam/checkpoints/hsi_b_r2_fullbody_seam_epoch222.pth
w: 1
use_guidance: false
guidance_weight: 1
hsi_guidance_posterior_coef1: false
hsi_progress_fix: true
occ_permute_fix: true
