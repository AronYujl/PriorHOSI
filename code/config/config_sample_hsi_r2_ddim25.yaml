table3_inputs:
  unguided: ${oc.env:ROOT_DIR}/results/lingo_hsi/r2_ddim25_unguided_s42_20260909/hsi_b_r2_fullbody_seam_epoch222-merged08/evaluation/per_sequence_metrics.json
  guided: ${oc.env:ROOT_DIR}/results/lingo_hsi/r2_ddim25_guided_s42_20260909/hsi_b_r2_fullbody_seam_epoch222-merged08/evaluation/per_sequence_metrics.json
