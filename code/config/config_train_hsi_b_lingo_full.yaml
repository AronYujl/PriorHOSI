# Model B full-budget LINGO-only diffusion training config
#
# is_mix false on both model and sampler; see the rationale in
# config_train_hsi_b_lingo_short.yaml.
defaults:
  - dataset: lingo_v3_train
  - guidance:
      - pelvis
  - model:
      - infbagel
  - sampler:
      - pelvis
  - _self_

exp_name: hsi_b_lingo_full
seed: 42
random_seed: 42
sample_type: diffusion
lingo_scene_num: 45
lingo_data_ratio: 0.5
empty_omomo_scene: false
epochs: 223
ckpt_interval: 20
lingo_only: true

train: true
load_state_dict: false
batch_size: 512
effective_batch_size: 2048
gradient_accumulation_steps: 1
precision: bf16_tf32
# Layout: 4 GPUs x micro-batch 512 x accum 1. Measured 0.71223 s/update against
# 0.96221 for 8 x 256 x accum 1 (three interleaved 40-update samples per arm;
# the arms are disjoint by 28x the widest within-arm spread). See registry
# amendment p1-hsi-b-layout-4x512-s42-20260814. Fallback is 8 x 256 x accum 1,
# same effective batch, +10.15 h.
lr: 0.0002
warmup_updates: 2000
device: cuda:0
use_tensorboard: true
save_checkpoints: true
max_optimizer_updates: 146255
benchmark_metrics_path: null
exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}

w: 0

num_gpus: 4
num_workers: 2
scene_type: occ_temp
max_window_size: 16
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: true
load_scene_goal: true
load_pelvis_goal: true
load_object_goal: true

human_only_ratio: 0.4

temp_voxel_num: 3

use_random_frame_bps: true
use_object_keypoints: true
add_object_voxel: true

loss_w_obj_pts: 50
loss_w_fk: 50
auto_regre_num: 2

start_epoch: 0
ckpt_path: ""
# "" starts fresh; "auto" continues {exp_dir}/checkpoints/{exp_name}_resume.pth
# when it exists; an explicit path must exist.  Resuming at a world size other
# than the one that wrote the state is rejected, not adapted.
resume_from: ""

hydra:
  run:
    dir: ${exp_dir}
