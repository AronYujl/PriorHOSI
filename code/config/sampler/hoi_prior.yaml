pelvis:
  _target_: priors.hoi.diffusion.HOIPriorSampler
  device: ${device}
  auto_regre_num: ${auto_regre_num}
  timesteps: 500
  object_so3_x0: false
  # Preregistered Phase 1B P2 inference-time contact guidance
  # (docs/EXPERIMENT_PLAN.md, "2026-08-01 ... 推理期接触引导 P2"). Disabled by
  # default: with enabled=false the 500-step native protocol is bit-identical to
  # every sealed D2-* result. Enable with
  #   sampler.pelvis.guidance.enabled=true sampler.pelvis.guidance.arm=a
  guidance:
    enabled: false
    # a = InfBaGel-faithful raw gradient on every step except the last.
    # b = CHOIS-style late-steps-only, posterior_variance[t]-scaled and clamped.
    arm: a
    # Arm A uses the released InfBaGel guidance_weight of 1.0.
    # Arm B's CHOIS analogue is classifier_scale = 1000.0.
    guidance_scale: 1.0
    # Arm B only: guided when 0 < reverse_step < last_steps (CHOIS 0 < i < 10).
    last_steps: 10
    # Arm B only: symmetric clamp bound, or null to disable clamping.
    clamp: 1.0
    # Arm B only: clamp the scaled gradient update, or the resulting x_{t-1}.
    clamp_target: update
    # Preregistered Phase 1B P5 contact-mask dose-response
    # (docs/EXPERIMENT_PLAN.md, "2026-08-04 ... 推理期接触 mask 剂量-响应").
    # The author's contact term is masked to frames the model itself already
    # believes are in contact (code/guidance_loss.py:29-31), so guidance
    # amplifies committed engagement rather than creating it.
    #
    # predicted = the author's own gate, the model's predicted contact.
    # ground_truth = a NON-DEPLOYABLE diagnostic upper bound; GT contact does
    #   not exist at inference time. It only bounds how much of the contact gap
    #   guidance could recover with a perfect engagement decision, and must
    #   never be used as a deployed configuration.
    contact_mask_source: predicted
    # The author's threshold. Defaults keep the guided path bit-identical to
    # every sealed P2/P3/D2-AI result.
    contact_mask_threshold: 0.95
    # Preregistered Phase 1B P6 hand sub-term reweighting
    # (docs/EXPERIMENT_PLAN.md, "2026-08-04 ... 推理期手部子项重加权").
    # The author's hand term is bs * (loss_contact + loss_consistency)
    # (code/guidance_loss.py:69), and the P5 mask sweep came out flat because
    # the two halves respond to mask width in OPPOSITE directions: widening the
    # mask raises the hinge loss_contact but lowers loss_consistency about 16x
    # harder, so the net loss falls. These two weights reweight the halves
    # independently. Defaults of 1.0 keep the guided path bit-identical to every
    # sealed P2/P3/P5/D2-AI result -- at the defaults the author's own function
    # is called, not a reimplementation of it.
    contact_weight: 1.0
    consistency_weight: 1.0
    # author = the author's own 1 - mean(similarity * mask), whose denominator is
    #   every one of the T*T frame pairs including the masked-off zeros.
    # masked_pairs = a DELIBERATE DEVIATION from the author's arithmetic that
    #   divides by the mask-on pairs only, repairing that normalization
    #   artifact. Results produced with it are NOT the author's protocol and
    #   must never be compared directly against the paper's Table 5.
    consistency_normalization: author
    # Preregistered Phase 1B P7 object-goal terminal term
    # (docs/EXPERIMENT_PLAN.md, "2026-08-05 ... 推理期物体终点项").
    # The author's guidance knows only "the palm should touch the object"; it has
    # no notion of where the object should END UP. The object channels are NOT
    # detached in the contact hinge, so guidance already moves the object -- it
    # moves it toward the hand, which is why stronger contact guidance measurably
    # WORSENS end_obj_trans_err (3.83750 unguided -> 3.91086 at contact_weight=3)
    # while improving the full trajectory obj_trans_dist (14.81981 -> 14.80752).
    #
    # object_goal is a task INPUT available at inference time, not ground truth,
    # so unlike the cell-U mask this term IS deployable. It stays 0.0 by default:
    # end_obj_trans_err scores the single frame whose target the model was handed,
    # so optimizing it directly is close to metric-gaming and any gain must be
    # reported beside obj_trans_dist to show whether the trajectory paid for it.
    object_goal_weight: 0.0
