pelvis:
  _target_: models.infbagel.Sampler
  device: ${device}
  mask_ind: ${guidance.pelvis.mask_ind}
  emb_f: ${guidance.pelvis.emb_f}
  batch_size: ${batch_size}
  channel: 232
  auto_regre_num: ${auto_regre_num}
  timesteps: 500
  ddim_timesteps: 25
  cm_timesteps: 16
  w: ${w}
  scene_type: ${scene_type}
  temp_voxel_num: ${temp_voxel_num}
  is_mix: false
  # oc.select with a null default: this sampler group is shared with configs
  # that never define the top-level key, and those must still resolve.
  # false = the released occ_list[0] layout, which every existing checkpoint was
  # trained under. Only set true for a model trained with it true.
  occ_list_layout_repaired: ${oc.select:occ_list_layout_repaired,false}
  hsi_guidance_norm_cap: ${oc.select:hsi_guidance_norm_cap,null}
  hsi_guidance_dose_scale: ${oc.select:hsi_guidance_dose_scale,null}
  hsi_guidance_alpha_decay: ${oc.select:hsi_guidance_alpha_decay,false}
  hsi_guidance_posterior_coef1: ${oc.select:hsi_guidance_posterior_coef1,false}
  # B-match seam weight, 0.0 = off.  Same oc.select pattern: model C's train
  # config and the sampling configs never define the top-level key, and they
  # must still resolve.  consistency_loss ignores it -- C is not in scope.
  seam_loss_weight: ${oc.select:seam_loss_weight,0.0}
  loss_w_jpos: ${oc.select:loss_w_jpos,1.0}
  pen_loss_weight: ${oc.select:pen_loss_weight,0.0}
  pen_delta: ${oc.select:pen_delta,0.03}
  pen_floor_height: ${oc.select:pen_floor_height,0.02}
  pen_sdf_cache: ${oc.select:pen_sdf_cache,null}
  pen_sdf_dtype: ${oc.select:pen_sdf_dtype,float16}
