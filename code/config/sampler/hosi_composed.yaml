# The two-expert composed sampler driven by the HOSI-test evaluator.
#
# One reverse chain, both experts called at every step, x_hat_0 blended by the
# preregistered gating operator.  `hoi_adapter` is the same HOIExpertSamplerAdapter
# the G==0 anchor row uses -- byte-identical knobs to sampler/hosi_hoi_expert.yaml --
# and `hsi_sampler` is the released Sampler, because HSIPrior IS that architecture
# and needs no adapter.
#
# GATE.  `gate` here is the scalar default and is deliberately the G==0 anchor, so a
# config that forgets to set it reproduces the HOI-alone row rather than silently
# producing an unlabelled blend.  Override `mixer_gate` for a constant dose, or
# point `sampler.pelvis.gate` at one of mixer.gates for a schedule / per-object /
# per-channel gate.  For the body split -- HSI on the root and legs, HOI on the arms
# and hands -- override the gate node itself:
#
#   ++sampler.pelvis.gate._target_=mixer.gates.BodyGroupGate
#   ++sampler.pelvis.gate.weights.root=1.0
#   ++sampler.pelvis.gate.weights.lower_body=1.0
#   ++sampler.pelvis.gate.weights.torso=0.0
#   ++sampler.pelvis.gate.weights.arms=0.0
#   ++sampler.pelvis.gate.weights.hands=0.0
#
# `++` on every key and one key per weight, both for a reason.  `gate` resolves to
# the SCALAR `${mixer_gate}`, so `gate._target_` is not in the struct and plain `=`
# raises `Key '_target_' is not in struct`; `++` adds-or-overrides and turns the
# scalar into the gate node.  And a `{root:1.0,...}` literal cannot survive the
# launcher, whose shard command lives inside a double-quoted tmux string where bash
# expands the braces -- dotted keys have no shell metacharacters at all.
#
# Those five values are BodyGroupGate's defaults, so `_target_` alone selects the
# same split; pass them anyway on a reportable row, so the audit records the split
# the row actually used rather than whatever the default was that day.  Groups and
# the per-joint layout: mixer/body_groups.py.
#
# CHANNEL MASK.  Not a knob.  `mixer_channel_mask` must resolve to 'human' (or to a
# tensor that is zero on 216:232); the sampler refuses `null` at construction, and a
# BodyGroupGate cannot open those channels either -- `hands` is a body group, the
# object is not.
pelvis:
  _target_: mixer.composed_sampler.HOSIComposedSampler
  gate: ${mixer_gate}
  # null keeps the historical raw channel gate byte-for-byte.  P2-KIN-API opts
  # into a separate local-rotation/FK operator; it is never selected implicitly.
  body_composer: ${oc.select:mixer_body_composer,null}
  channel_mask: ${mixer_channel_mask}
  hsi_object_voxel_mode: ${mixer_hsi_object_voxel_mode}
  hoi_adapter:
    _target_: mixer.hoi_adapter.HOIExpertSamplerAdapter
    device: ${device}
    auto_regre_num: ${auto_regre_num}
    timesteps: 500
    object_so3_x0: false
    # Phase 1B settled HOIPrior is P15 + guidance Arm B. Same values as
    # sampler/hosi_hoi_expert.yaml; set enabled=false for the unguided control.
    guidance:
      enabled: true
      arm: b
      guidance_scale: 1000.0
      last_steps: 10
      clamp: 1.0
      clamp_target: update
      contact_mask_source: predicted
      contact_mask_threshold: 0.95
      contact_weight: 1.0
      consistency_weight: 1.0
      consistency_normalization: author
      object_goal_weight: 0.0
  hsi_sampler:
    _target_: models.infbagel.Sampler
    device: ${device}
    mask_ind: ${guidance.pelvis.mask_ind}
    emb_f: ${guidance.pelvis.emb_f}
    batch_size: ${batch_size}
    channel: 232
    auto_regre_num: ${auto_regre_num}
    timesteps: 500
    ddim_timesteps: 25
    cm_timesteps: 16
    # HSIPrior's inference CFG scale.  Its "uncond" pass zeroes only the TEMPORAL
    # scene embeddings, so this amplifies dynamic scene perception specifically --
    # the one term HOIPrior has no analogue for.  Never set it to 0 to "simplify"
    # the composed run: that de-scenes the scene expert.
    w: ${mixer_hsi_w}
    scene_type: ${scene_type}
    temp_voxel_num: ${temp_voxel_num}
    is_mix: false
    # P17-OC is the first checkpoint trained with the repaired occ_list[0] layout,
    # so a composed row using it MUST set occ_list_layout_repaired: true at the top
    # level. Every earlier checkpoint keeps the released default of false.
    occ_list_layout_repaired: ${oc.select:occ_list_layout_repaired,false}
    hsi_guidance_norm_cap: ${oc.select:hsi_guidance_norm_cap,null}
    hsi_guidance_dose_scale: ${oc.select:hsi_guidance_dose_scale,null}
    hsi_guidance_alpha_decay: ${oc.select:hsi_guidance_alpha_decay,false}
    # Native R2-CG applies this in Sampler.p_sample. The composed loop owns the
    # shared posterior, so it reads the same sampler property and applies the
    # same coefficient to human-scene guidance on the actual composed body.
    hsi_guidance_posterior_coef1: ${oc.select:hsi_guidance_posterior_coef1,false}
    seam_loss_weight: ${oc.select:seam_loss_weight,0.0}
    loss_w_jpos: ${oc.select:loss_w_jpos,1.0}
    pen_loss_weight: ${oc.select:pen_loss_weight,0.0}
    pen_delta: ${oc.select:pen_delta,0.03}
    pen_floor_height: ${oc.select:pen_floor_height,0.02}
    pen_sdf_cache: ${oc.select:pen_sdf_cache,null}
    pen_sdf_dtype: ${oc.select:pen_sdf_dtype,float16}
  # Separate from cfg.use_guidance: that evaluator switch selects the joint
  # HOSI guidance function, including object/contact terms. The scene expert's
  # frozen recipe is human-scene only and is implemented inside the composed
  # posterior instead.
  hsi_guidance_scale: ${oc.select:hsi_guidance_scale,1.0}
