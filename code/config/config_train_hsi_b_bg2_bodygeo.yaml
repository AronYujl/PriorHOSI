# BG2: formal full diffusion continuation from the sealed R2 HSI checkpoint.
defaults: [config_train_hsi_b_r2_fullbody_seam, _self_]

exp_name: hsi_b_bg2_bodygeo
seed: 42
random_seed: 42
sample_type: diffusion
lingo_only: true
train: true

# The body-group temporal branch was selected by the matched BG1-R1 probe.
body_geometry_enabled: true
body_geometry_encoder: body_group_tokens_temporal
body_geometry_permutation: identity
body_geometry_loss_weight: 0.25590593335809264
body_geometry_calibration: false
geometry_loss_fp32: true
pen_sdf_cache: /data/yujinlun/InfBaGel-hsi/.cache/hsi_sdf
model:
  infbagel:
    body_geometry_encoder: ${body_geometry_encoder}

# Continue from the sealed R2 final EMA weights and initialize only the new
# geometry refiner. The full expert budget uses the conventional 2048 tier.
ckpt_path: /data/yujinlun/InfBaGel-hsi-r2/results/hsi_b_r2_fullbody_seam/checkpoints/hsi_b_r2_fullbody_seam_epoch222.pth
checkpoint_load_mode: body_geometry_warm_start
load_state_dict: true
resume_from: ""

num_gpus: 8
batch_size: 128
effective_batch_size: 2048
gradient_accumulation_steps: 2
precision: bf16_tf32
lr: 0.0002
warmup_updates: 2000
lr_decay_start_update: 117004
max_optimizer_updates: 146255
epochs: 223
diffusion_ema_decay: 0.9999
export_final_checkpoint_only: true
ckpt_interval: 20
save_checkpoints: true
use_tensorboard: true
run_id: null
exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}
