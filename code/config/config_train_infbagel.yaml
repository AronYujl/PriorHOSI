defaults:
  - dataset: omomo
  - guidance:
      - pelvis
  - model:
      - infbagel
  - sampler:
      - pelvis
  - _self_

exp_name: infbagel
seed: 42
sample_type: diffusion
train: true
load_state_dict: false
# Historical Phase 0 default. Formal HOI/HSI training must independently select
# a registered power-of-two effective-batch tier from the training-resource
# protocol; this default is not a cross-expert constraint.
batch_size: 128
effective_batch_size: 1024
gradient_accumulation_steps: 1
lr: 0.0001
epochs: 501
device: cuda:0
use_tensorboard: true
ckpt_interval: 20
save_checkpoints: true
# Null means full training. The micro-batch audit sets one optimizer update and
# writes per-rank peak-memory metrics without producing a checkpoint.
max_optimizer_updates: null
benchmark_metrics_path: null
exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}

w: 1

num_gpus: 8
num_workers: 2
scene_type: occ_temp
max_window_size: 16
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: true
load_scene_goal: true
load_pelvis_goal: true
load_object_goal: true

use_random_frame_bps: true
use_object_keypoints: true
add_object_voxel: true

loss_w_obj_pts: 50
loss_w_fk: 50
auto_regre_num: 2

temp_voxel_num: 3

start_epoch: 0
ckpt_path: ""

hydra:
  run:
    dir: ${exp_dir}
